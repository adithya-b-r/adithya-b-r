<svg xmlns="http://www.w3.org/2000/svg" width="440" height="32" fill="none" viewBox="0 0 440 32"><defs><linearGradient id="taglineGrad" x1="0%" x2="200%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="25%" stop-color="#818cf8"/><stop offset="50%" stop-color="#c084fc"/><stop offset="75%" stop-color="#60a5fa"/><stop offset="100%" stop-color="#38bdf8"/></linearGradient><linearGradient id="taglineSweep" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="30%" stop-color="#38bdf8" stop-opacity=".3"/><stop offset="50%" stop-color="#fff" stop-opacity=".95"/><stop offset="70%" stop-color="#c084fc" stop-opacity=".3"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></linearGradient><filter id="tagGlow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="0" flood-color="#38bdf8" flood-opacity=".45" stdDeviation="3"/></filter><clipPath id="tagTextClip"><text x="50%" y="22" font-family="'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, Menlo, Monaco, monospace" font-size="16" font-weight="700" letter-spacing=".4" text-anchor="middle">Builder by nature, Coder by profession</text></clipPath></defs><g class="glow-wrap"><text x="50%" y="22" fill="url(#taglineGrad)" filter="url(#tagGlow)" font-family="'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, Menlo, Monaco, monospace" font-size="16" font-weight="700" letter-spacing=".4" text-anchor="middle">Builder by nature, Coder by profession</text></g><g clip-path="url(#tagTextClip)" pointer-events="none"><rect width="880" height="32" x="-220" y="0" fill="url(#taglineGrad)" class="grad-flow"/><rect width="100" height="32" x="0" y="0" fill="url(#taglineSweep)" class="tag-sweep"/></g><style>@keyframes pulseGlow{0%{opacity:.75}}@keyframes flowGrad{0%{transform:translateX(0)}}@keyframes tagSweep{0%{transform:translateX(-120px) skewX(-20deg);opacity:0}6%{opacity:1}65%{transform:translateX(480px) skewX(-20deg);opacity:1}72%,99.9%{transform:translateX(480px) skewX(-20deg);opacity:0}}.glow-wrap{animation:pulseGlow 4s ease-in-out infinite alternate}.grad-flow{animation:flowGrad 6s linear infinite}.tag-sweep{animation:tagSweep 4.5s ease-in-out infinite}</style></svg>