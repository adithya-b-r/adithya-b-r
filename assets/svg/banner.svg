<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="45%" stop-color="#0b1026"/>
      <stop offset="80%" stop-color="#111b3d"/>
      <stop offset="100%" stop-color="#070b1e"/>
    </linearGradient>

    <radialGradient id="nebulaBlue" cx="18%" cy="50%" r="30%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#050816" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nebulaCyan" cx="85%" cy="40%" r="28%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#050816" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nebulaPurple" cx="50%" cy="30%" r="35%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#050816" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="planetGrad" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="35%" stop-color="#4f46e5"/>
      <stop offset="70%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#050816"/>
    </linearGradient>

    <linearGradient id="planetAtmosphere" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#050816" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="tractorBeam" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.65"/>
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#050816" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="horizonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="horizonDeep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="40%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>

    <linearGradient id="horizonLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#818cf8" flood-opacity="0.35"/>
    </filter>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <linearGradient id="textSweepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="46%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="54%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#818cf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="textSweepClip">
      <text x="600" y="78"
            text-anchor="middle"
            font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
            font-size="36"
            font-weight="700"
            letter-spacing="0.5">
        Welcome, Visitor!
      </text>
      <text x="600" y="116"
            text-anchor="middle"
            font-family="'JetBrains Mono', 'Fira Code', Consolas, Menlo, monospace"
            font-size="16"
            letter-spacing="0.8">
        Java • Spring Boot • AWS • Backend Engineering
      </text>
    </clipPath>
  </defs>

  <rect width="1200" height="200" fill="url(#bgGrad)"/>
  <rect width="1200" height="200" fill="url(#nebulaBlue)"/>
  <rect width="1200" height="200" fill="url(#nebulaCyan)"/>
  <rect width="1200" height="200" fill="url(#nebulaPurple)"/>

  <g class="star-group">
    <circle cx="50" cy="45" r="1.2" fill="#fff" class="twinkle-1"/>
    <circle cx="95" cy="80" r="1.8" fill="#e0f2fe" class="twinkle-2"/>
    <circle cx="130" cy="30" r="1" fill="#fff" class="twinkle-3"/>
    <circle cx="150" cy="65" r="0.8" fill="#bae6fd" class="twinkle-4"/>
    <circle cx="220" cy="40" r="1.6" fill="#fff" class="twinkle-1"/>
    <circle cx="250" cy="95" r="1" fill="#e0f2fe" class="twinkle-2"/>
    <circle cx="285" cy="25" r="1.2" fill="#fff" class="twinkle-3"/>
    <circle cx="75" cy="140" r="1" fill="#bae6fd" class="twinkle-4"/>
    <circle cx="115" cy="165" r="0.8" fill="#fff" class="twinkle-1"/>
    <circle cx="210" cy="150" r="1.5" fill="#e0f2fe" class="twinkle-2"/>

    <circle cx="920" cy="35" r="1" fill="#fff" class="twinkle-2"/>
    <circle cx="950" cy="90" r="1.6" fill="#e0f2fe" class="twinkle-3"/>
    <circle cx="985" cy="25" r="0.9" fill="#bae6fd" class="twinkle-4"/>
    <circle cx="1050" cy="40" r="1.7" fill="#fff" class="twinkle-1"/>
    <circle cx="1085" cy="95" r="1.1" fill="#e0f2fe" class="twinkle-2"/>
    <circle cx="1115" cy="30" r="1.8" fill="#fff" class="twinkle-3"/>
    <circle cx="1145" cy="75" r="1" fill="#bae6fd" class="twinkle-4"/>
    <circle cx="1165" cy="120" r="1.4" fill="#fff" class="twinkle-1"/>
    <circle cx="940" cy="150" r="1" fill="#e0f2fe" class="twinkle-2"/>
    <circle cx="1090" cy="145" r="1.3" fill="#fff" class="twinkle-3"/>

    <circle cx="350" cy="22" r="1" fill="#fff" class="twinkle-1"/>
    <circle cx="420" cy="32" r="1.4" fill="#e0f2fe" class="twinkle-2"/>
    <circle cx="500" cy="18" r="0.8" fill="#bae6fd" class="twinkle-3"/>
    <circle cx="580" cy="26" r="1.2" fill="#fff" class="twinkle-4"/>
    <circle cx="640" cy="16" r="1" fill="#e0f2fe" class="twinkle-1"/>
    <circle cx="710" cy="24" r="1.5" fill="#fff" class="twinkle-2"/>
    <circle cx="780" cy="20" r="0.9" fill="#bae6fd" class="twinkle-3"/>
    <circle cx="850" cy="35" r="1.3" fill="#fff" class="twinkle-4"/>

    <path d="M 260 41 L 261 44 L 264 45 L 261 46 L 260 49 L 259 46 L 256 45 L 259 44 Z" fill="#93c5fd" class="twinkle-1"/>
    <path d="M 960 36 L 961 39 L 964 40 L 961 41 L 960 44 L 959 41 L 956 40 L 959 39 Z" fill="#93c5fd" class="twinkle-3"/>
  </g>

  <g class="planet-group">
    <circle cx="60" cy="8" r="54" fill="none" stroke="url(#planetAtmosphere)" stroke-width="2.5" opacity="0.75" filter="url(#glow)"/>
    <circle cx="60" cy="8" r="52" fill="url(#planetGrad)"/>
    <path d="M 24 16 Q 55 42 90 28 A 52 52 0 0 1 15 -18 Q 10 2 24 16 Z" fill="#050816" opacity="0.6"/>
  </g>

  <g class="horizon-group">
    <path class="horizon-glow" d="M 0 168 Q 300 148 600 158 T 1200 164 L 1200 200 L 0 200 Z" fill="url(#horizonGrad)" opacity="0.45"/>
    <path class="horizon-base" d="M 0 178 C 350 158 850 176 1200 170 L 1200 200 L 0 200 Z" fill="url(#horizonDeep)" opacity="0.75"/>
    <path class="horizon-line" d="M 0 172 Q 320 152 600 162 T 1200 166" fill="none" stroke="url(#horizonLineGrad)" stroke-width="1.8" filter="url(#glow)" opacity="0.8"/>
    <path d="M 0 182 Q 400 164 750 174 T 1200 176" fill="none" stroke="#38bdf8" stroke-width="0.8" opacity="0.35"/>
  </g>

  <g class="astronaut">
    <path d="M 158 107 C 145 98 132 118 112 105" stroke="#38bdf8" stroke-width="0.8" fill="none" opacity="0.3" stroke-dasharray="2 3"/>
    <rect x="157" y="93" width="7" height="22" rx="3" fill="#475569"/>
    <rect x="162" y="97" width="20" height="22" rx="7" fill="#e2e8f0"/>
    <rect x="168" y="102" width="9" height="6" rx="1.5" fill="#1e293b"/>
    <circle cx="174" cy="105" r="1.2" fill="#22d3ee"/>
    <circle cx="173" cy="88" r="11" fill="#f8fafc"/>
    <ellipse cx="175" cy="88" rx="8" ry="6" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8"/>
    <ellipse cx="177" cy="86" rx="3.5" ry="1.8" fill="#38bdf8" opacity="0.75"/>
    <path d="M 163 100 Q 153 105 156 112" stroke="#cbd5e1" stroke-width="4.2" stroke-linecap="round" fill="none"/>
    <path d="M 181 100 Q 189 104 187 111" stroke="#cbd5e1" stroke-width="4.2" stroke-linecap="round" fill="none"/>
    <path d="M 167 118 Q 163 129 166 132" stroke="#cbd5e1" stroke-width="4.2" stroke-linecap="round" fill="none"/>
    <path d="M 177 118 Q 180 129 184 131" stroke="#94a3b8" stroke-width="4.2" stroke-linecap="round" fill="none"/>
  </g>

  <g class="ufo-group">
    <polygon points="1020,74 985,160 1055,160" fill="url(#tractorBeam)" class="ufo-beam"/>
    <path d="M 1009 65 Q 1020 54 1031 65 Z" fill="#38bdf8" opacity="0.85"/>
    <ellipse cx="1020" cy="63" rx="6.5" ry="3.5" fill="#cffafe" opacity="0.8"/>
    <ellipse cx="1020" cy="68" rx="26" ry="6.5" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8"/>
    <ellipse cx="1020" cy="71" rx="21" ry="4" fill="#0f172a" stroke="#818cf8" stroke-width="0.6"/>
    <circle cx="1002" cy="70" r="1.5" fill="#22d3ee"/>
    <circle cx="1011" cy="72" r="1.5" fill="#a78bfa"/>
    <circle cx="1020" cy="72.5" r="1.5" fill="#22d3ee"/>
    <circle cx="1029" cy="72" r="1.5" fill="#a78bfa"/>
    <circle cx="1038" cy="70" r="1.5" fill="#22d3ee"/>
    <ellipse cx="1020" cy="74" rx="8" ry="2.5" fill="#06b6d4" opacity="0.8" filter="url(#glow)"/>
  </g>

  <text x="600" y="78"
        text-anchor="middle"
        fill="url(#titleGrad)"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="36"
        font-weight="700"
        letter-spacing="0.5"
        filter="url(#textGlow)">
    Welcome, Visitor!
  </text>

  <text x="600" y="116"
        text-anchor="middle"
        fill="#cbd5e1"
        font-family="'JetBrains Mono', 'Fira Code', Consolas, Menlo, monospace"
        font-size="16"
        letter-spacing="0.8">
    Java • Spring Boot • AWS • Backend Engineering
  </text>

  <g clip-path="url(#textSweepClip)" pointer-events="none">
    <rect class="text-sweep" x="0" y="35" width="160" height="95" fill="url(#textSweepGrad)"/>
  </g>

  <style>
    .twinkle-1 { animation: twinkle 3.2s ease-in-out infinite; }
    .twinkle-2 { animation: twinkle 4.5s ease-in-out infinite 1.1s; }
    .twinkle-3 { animation: twinkle 2.8s ease-in-out infinite 1.8s; }
    .twinkle-4 { animation: twinkle 5.1s ease-in-out infinite 0.5s; }

    @keyframes twinkle {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 0.95; }
    }

    .astronaut {
      animation: astronautFloat 7s ease-in-out infinite;
      transform-origin: 175px 105px;
    }

    @keyframes astronautFloat {
      0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
      50% { transform: translate(-3px, -11px) rotate(4deg); }
    }

    .ufo-group {
      animation: ufoDrift 6.5s ease-in-out infinite;
      transform-origin: 1020px 68px;
    }

    @keyframes ufoDrift {
      0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
      50% { transform: translate(14px, -7px) rotate(-2deg); }
    }

    .ufo-beam {
      animation: beamPulse 3.5s ease-in-out infinite;
    }

    @keyframes beamPulse {
      0%, 100% { opacity: 0.22; }
      50% { opacity: 0.5; }
    }

    .horizon-line {
      animation: horizonSway 8s ease-in-out infinite alternate;
    }

    @keyframes horizonSway {
      0% { transform: translateY(0px); opacity: 0.7; }
      100% { transform: translateY(-3px); opacity: 0.95; }
    }

    .text-sweep {
      animation: textSweep 4.5s ease-in-out infinite;
    }

    @keyframes textSweep {
      0% {
        transform: translateX(180px) skewX(-20deg);
        opacity: 0;
      }
      6% {
        opacity: 1;
      }
      70% {
        transform: translateX(1000px) skewX(-20deg);
        opacity: 1;
      }
      76%, 99.9% {
        transform: translateX(1000px) skewX(-20deg);
        opacity: 0;
      }
      100% {
        transform: translateX(180px) skewX(-20deg);
        opacity: 0;
      }
    }
  </style>
</svg>